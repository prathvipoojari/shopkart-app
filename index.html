<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopKart Demo</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Welcome to ShopKart</h1>

    <p>Your one-stop shopping destination (demo project).</p>

    <button onclick="showPopup()">Shop Now</button>

    <!-- Custom Popup -->
    <div id="popup">
        <h2>🛒 Welcome!</h2>
        <p>Happy Shopping! 😊</p>

        <a href="home.html" style="display:inline-block; margin-right:10px; background:#fb641b; color:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:bold;">Enter Store 🛍️</a>
        <button onclick="closePopup()">Close</button>
    </div>

    <script>
        function showPopup() {
            var popup = document.getElementById('popup');
            if (popup) popup.style.display = 'block';
        }

        function closePopup() {
            var popup = document.getElementById('popup');
            if (popup) popup.style.display = 'none';
        }
    </script>

</body>
</html>
